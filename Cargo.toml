[package]
name = "rust-mri-demo"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
flate2 = "1.1.9"
nifti = "0.17"
ndarray = { version = "0.16", features = ["rayon"] }
rayon = "1.12.0"
nalgebra = "0.35.0"
glob = "0.3.4"
tempfile = "3.27.0"

[build]
rustflags = ["-C", "target-cpu=native"]
